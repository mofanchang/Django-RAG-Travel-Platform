{% extends "base.html" %}

{% block title %}登入{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-16 p-8 bg-white rounded-lg shadow">
    <h2 class="text-2xl font-bold mb-6 text-center">登入</h2>

    {% if form.errors %}
    <div class="bg-red-100 text-red-700 p-3 rounded mb-4">
        帳號或密碼錯誤，請再試一次。
    </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="mb-4">
            <label class="block text-gray-700 mb-1">Email</label>
            <input type="email" name="login" required
                class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
                placeholder="your@email.com">
        </div>
        <div class="mb-6">
            <label class="block text-gray-700 mb-1">密碼</label>
            <input type="password" name="password" required
                class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
                placeholder="••••••••">
        </div>
        <button type="submit"
            class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition">
            登入
        </button>
    </form>

    <hr class="my-6">

    <a href="{% url 'google_login' %}"
        class="w-full flex items-center justify-center gap-2 border border-gray-300 rounded py-2 hover:bg-gray-50 transition">
        <svg class="w-5 h-5" viewBox="0 0 48 48">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.34-8.16 2.34-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        使用 Google 登入
    </a>

    <p class="text-center mt-4 text-gray-600">
        還沒有帳號？
        <a href="{% url 'account_signup' %}" class="text-blue-600 hover:underline">立即註冊</a>
    </p>
</div>
{% endblock %}
