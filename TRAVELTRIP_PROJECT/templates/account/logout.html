{% extends "base.html" %}

{% block title %}登出{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-24 p-8 bg-white rounded-2xl shadow text-center">
    <h2 class="text-2xl font-bold mb-3">確定要登出嗎？</h2>
    <p class="text-gray-500 mb-6">期待你下次再來！</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="bg-red-500 hover:bg-red-600 text-white px-8 py-2 rounded-full font-semibold transition mr-3">
            登出
        </button>
        <a href="/" class="text-gray-500 hover:text-gray-700 underline">取消</a>
    </form>
</div>
{% endblock %}
