{% load static %}
<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <title>{% block title %}旅遊網站{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{% static 'frontend/css/main.e6c13ad2.css' %}">
  <style>
    body,
    main,
    .container {
      min-width: 0;
      width: 100%;
    }

    @media (max-width: 640px) {
      .container {
        padding: 0 10px;
        max-width: 100%;
      }

      nav {
        padding: 1rem;
      }

      .grid-cols-4,
      .grid-cols-3 {
        grid-template-columns: 1fr !important;
      }
    }

    input[type="text"],
    input[type="date"] {
      pointer-events: auto !important;
      opacity: 1 !important;
      cursor: text;
    }
  </style>
</head>

<body class="bg-gray-50 min-h-screen">

  <!-- Navbar -->
  <nav class="bg-blue-600 text-white shadow-md">
    <div class="container mx-auto px-4 py-3 flex justify-between items-center">
      <a href="/" class="font-bold text-xl tracking-wide">TRAVELTRIP</a>
      <div class="flex items-center gap-6 text-sm">
        <a href="/" class="hover:text-blue-200 transition">首頁</a>
        <a href="{% url 'trips:trip_list' %}" class="hover:text-blue-200 transition">所有行程</a>
        <a href="{% url 'cart_view' %}" class="hover:text-blue-200 transition">購物車</a>
        {% if user.is_authenticated %}
        <a href="{% url 'bookings:booking_list' %}" class="hover:text-blue-200 transition">我的訂單</a>
        <a href="{% url 'profile' %}" class="hover:text-blue-200 transition">個人資料</a>
        <a href="{% url 'account_logout' %}"
          class="bg-white text-blue-600 px-3 py-1 rounded-full font-semibold hover:bg-blue-50 transition">登出</a>
        {% else %}
        <a href="{% url 'account_login' %}" class="hover:text-blue-200 transition">登入</a>
        <a href="{% url 'account_signup' %}"
          class="bg-white text-blue-600 px-3 py-1 rounded-full font-semibold hover:bg-blue-50 transition">註冊</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="container mx-auto mt-6 px-4">
    {% if messages %}
    <div id="toast-container" class="fixed top-6 right-6 z-50 flex flex-col gap-3">
      {% for message in messages %}
      <div class="toast-msg flex items-center gap-3 px-5 py-4 rounded-xl shadow-lg text-white text-sm font-medium bg-gray-800">
        {{ message }}
      </div>
      {% endfor %}
    </div>
    <script>
      setTimeout(() => {
        document.querySelectorAll('.toast-msg').forEach(el => {
          el.style.transition = 'opacity 0.5s';
          el.style.opacity = '0';
          setTimeout(() => el.remove(), 500);
        });
      }, 3000);
    </script>
    {% endif %}

    {% block content %}{% endblock %}
  </main>

  <!-- 聊天元件掛載點 -->
  <div id="chat-root"></div>

  <script src="{% static 'frontend/js/main.8eb65021.js' %}"></script>
</body>

</html>
